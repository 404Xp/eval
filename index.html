.err{color:var(--red);font-weight:700;margin-top:14px;min-height:24px}
details{background:var(--bg);border:2px solid var(--line);border-radius:18px;margin-bottom:12px}
summary{cursor:pointer;padding:16px 20px;font-weight:700;display:flex;justify-content:space-between;gap:10px;list-style:none}

.body{padding:0 20px 20px}

.mut{color:var(--mut);margin:0 0 12px}h3{margin:0 0 6px;font-size:18px}.card2{border:2px solid var(--line);border-radius:18px;padding:16px 20px;margin:16px 0}.card2 .nav{margin-top:12px;padding-top:0;border:0}

</style>

  S.mgrs=(l.items||[]).sort((a,b)=>ar(a.n,b.n));S.hals=(h.items||[]).sort((a,b)=>ar(a.n,b.n));S.set=s;draw()}
 catch(e){$("view").innerHTML='<p class="err">تعذر تحميل البيانات.</p><button class="btn p" onclick="draw()">إعادة المحاولة</button>'}}
async function refresh(){S.emps=((await db.doc("mgrState/"+S.k).get()).data()||{}).emps||{}}
function login(){
 $("steps").innerHTML="";
 const dl=(id,a)=>`<datalist id="${id}">${a.map(x=>`<option value="${esc(x.n)}">`).join("")}</datalist>`;
 $("view").innerHTML=`<h2>الدخول</h2>
 <label class="chk"><input type="checkbox" id="ack"> أدركت خصوصية الرابط وألتزم بذلك (خاص بالقياديات فقط)</label>
 <div class="card2"><h3>القيادات ومشرفات الميدان</h3><label class="f" for="mg">اسم المديرة <b>*</b></label><input type="text" id="mg" list="ml" autocomplete="off" placeholder="اكتبي اسمك واختاريه من القائمة">${dl("ml",S.mgrs)}<div class="nav"><span></span><button class="btn p" id="nx">دخول</button></div></div>
 <div class="card2"><h3>الحلقات</h3><label class="f" for="hl">اسم الحلقة <b>*</b></label><input type="text" id="hl" list="hlist" autocomplete="off" placeholder="اكتبي اسم الحلقة واختاريها من القائمة">${dl("hlist",S.hals)}<div class="nav"><span></span><button class="btn p" id="nh">دخول</button></div></div>
 <div class="err" id="err" role="alert"></div>`;
 const enter=async(mode,list,inp)=>{const n=$(inp).value.trim(),it=list.find(x=>x.n==n);
  if(!$("ack").checked)return $("err").textContent="يلزم الإقرار بخصوصية الرابط";
  if(!it)return $("err").textContent=mode=="H"?"اختاري الحلقة من القائمة":"اختاري اسمك من القائمة";
  $("err").textContent="جارٍ التحميل...";
  try{S.mode=mode;S.m=n;S.k=it.k;S.U=await Promise.all(it.u.map(async u=>({u,...(await db.doc("units/"+u).get()).data()})));
   S.U.sort((a,b)=>ar(a.unit,b.unit));await refresh();S.cur=S.U.length==1?S.U[0]:null;S.step=0;draw()}
  catch(e){S.U=null;$("err").textContent="تعذر التحميل، حاولي مرة أخرى"}};
 $("nx").onclick=()=>enter("M",S.mgrs,"mg");$("nh").onclick=()=>enter("H",S.hals,"hl")}
function dash(){
 const out=()=>{if(S.cur&&S.U.length>1){S.cur=null}else{Object.assign(S,{U:null,cur:null,m:"",k:"",emps:{}})}draw()};
 if(!S.cur){
  $("view").innerHTML=`<h2>${esc(EV())}</h2><p class="mut">اختاري الموقع</p>${S.U.map((x,i)=>{const t=uq(x.staff),d=t.filter(y=>(S.emps[y.id]||{}).s=="done").length;return `<button type="button" class="row" data-l="${i}"><div><b>${esc(x.unit)}</b><br><small>${esc(x.dom)}</small></div><span class="tag">${d} من ${t.length}</span></button>`}).join("")}<div class="nav"><button class="btn" id="out">تغيير المديرة</button><span></span></div>`;
  document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{S.cur=S.U[b.dataset.l];draw()});$("out").onclick=out;return}
 const st=uq(S.cur.staff),done=st.filter(x=>(S.emps[x.id]||{}).s=="done").length,lab={done:"تم ✓",draft:"مسودة",new:"لم يبدأ"},op=isOpen(),ce=canEdit();
 $("view").innerHTML=`<h2>${esc(EV())}</h2><p class="mut">${esc(S.cur.unit)}</p><span class="count">${done} من ${st.length} موظفات تم تقييمهن</span>${op?"":'<p class="err">التقييم مغلق حالياً</p>'}
 ${st.length?"":'<p class="err">لا توجد موظفات مباشرات في هذا الموقع</p>'}
 ${st.map((x,i)=>{const e=S.emps[x.id]||{},s=e.s||"new";return `<div class="row"><div><b>${esc(x.n)}</b><br><small>${x.c}${e.d?" · "+e.d:""}</small></div><span class="tag ${s}">${lab[s]}</span>${s=="done"?`<button class="btn sm" data-v="${i}">عرض</button>${ce?`<button class="btn p sm" data-e="${i}">تعديل</button>`:""}`:op?`<button class="btn p sm" data-i="${i}">${s=="draft"?"أكملي":"ابدئي"}</button>`:""}</div>`}).join("")}
 <div class="nav"><button class="btn" id="out">${S.U.length>1?"المواقع":"تغيير المديرة"}</button><span></span></div>`;
 const pick=async(x,m)=>{S.emp=x.n;S.eid=x.id;S.cat=CATS.indexOf(x.c);S.sc={};S.nt={};S.free="";S.edit=m==1;
  try{if(m==0){const d=S.emps[x.id]||{};if(d.dr){const q=JSON.parse(d.dr);S.sc=q.sc||{};S.nt=q.nt||{};S.free=q.free||""}return go(1)}
   const d=(await db.doc("evaluations/"+S.k+"_"+x.id).get()).data();if(!d)return alert("تعذر العثور على التقييم");
   if(m==2)return viewEval(x,d);
   JSON.parse(d.items).forEach(r=>{const i=CR[S.cat].findIndex(c=>c[0]==r.b);if(i>=0){S.sc[i]=r.s;S.nt[i]=r.n}});S.free=d.free||"";go(1)}
  catch(e){alert("تعذر التحميل، حاولي مرة أخرى")}};
 [["i",0],["e",1],["v",2]].forEach(([a,m])=>document.querySelectorAll("[data-"+a+"]").forEach(b=>b.onclick=()=>pick(st[b.dataset[a]],m)));
 $("out").onclick=out}
function viewEval(x,d){const L=JSON.parse(d.items||"[]");$("steps").innerHTML="";
 $("view").innerHTML=`<h2>${esc(x.n)}</h2><p class="mut">${x.c} · ${esc(d.unit)}<br>المقيِّمة: ${esc(d.ev)}</p><div class="total">المجموع: ${d.total} من ${d.max} (${Math.round(d.total/d.max*100)}٪)</div>
 <table><tr><th>البند</th><th>الدرجة</th><th>الملاحظات</th></tr>${L.map(r=>`<tr><td>${esc(r.b)}</td><td>${r.s}/${r.m}</td><td>${esc(r.n)}</td></tr>`).join("")}</table>${d.free?`<p><b>مساحة حرة:</b> ${esc(d.free)}</p>`:""}
 <div class="nav noprint"><button class="btn" id="bk">رجوع</button><button class="btn" onclick="print()">طباعة</button></div>`;$("bk").onclick=draw}
function p2(){
 const L=items();
 $("view").innerHTML=`<div class="err top" id="err0" role="alert"></div><h2>تقييم ${CATS[S.cat]==="معلمة"?"المعلمات":CATS[S.cat]==="إدارية"?"الإداريات":CATS[S.cat]==="حاضنة"?"الحاضنات":"الحارسات"}</h2><p class="mut">${esc(S.emp)}${S.edit?" · تعديل تقييم سابق":""}</p><span class="count" id="cnt"></span>
 ${L.map((c,i)=>{const m=c[1];return `<details ${i==0?"open":""}><summary><span>${c[0]}</span><small id="b${i}">من ${m}</small></summary><div class="body"><ul class="subs">${c[2].map(x=>`<li><span>${x[0]}</span><b>${x[1]}</b></li>`).join("")}</ul>
 <div class="chips">${Array.from({length:m},(_,k)=>`<button type="button" class="chip ${S.sc[i]==k+1?"sel":""}" data-i="${i}" data-v="${k+1}">${k+1}</button>`).join("")}</div>
 <label class="f" for="n${i}">الملاحظات <b>*</b></label><textarea id="n${i}" rows="2" data-n="${i}">${esc(S.nt[i])}</textarea></div></details>`}).join("")}
 <label class="f" for="free">مساحة حرة وتفاصيل</label><textarea id="free" rows="3">${esc(S.free)}</textarea>
 <div class="err" id="err" role="alert"></div><div class="nav"><button class="btn" id="bk">رجوع</button>${S.edit?"":'<button class="btn" id="sv">حفظ وأكمل لاحقاً</button>'}<button class="btn p" id="nx">مراجعة التقييم</button></div>`;
 const err=m=>{$("err").textContent=m;$("err0").textContent=m};
 const upd=()=>{let d=0;L.forEach((c,i)=>{const ok=S.sc[i]&&(S.nt[i]||"").trim();if(ok)d++;const b=$("b"+i);b.className=ok?"ok":"";b.textContent=S.sc[i]?`${S.sc[i]} من ${c[1]}`:`من ${c[1]}`});$("cnt").textContent=`${d} من ${L.length} بنود مكتملة`};upd();
 document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const i=b.dataset.i;S.sc[i]=+b.dataset.v;b.parentNode.querySelectorAll(".chip").forEach(x=>x.classList.toggle("sel",x==b));upd()});
 document.querySelectorAll("[data-n]").forEach(t=>t.oninput=()=>{S.nt[t.dataset.n]=t.value;upd()});
 $("free").oninput=e=>S.free=e.target.value;$("bk").onclick=()=>go(0);
 if($("sv"))$("sv").onclick=async()=>{$("sv").disabled=true;err("جارٍ الحفظ...");try{await db.doc("mgrState/"+S.k).set({emps:{[S.eid]:{s:"draft",dr:JSON.stringify({sc:S.sc,nt:S.nt,free:S.free}),d:""}}},{merge:true});await refresh();go(0)}catch(e){err("تعذر الحفظ، حاولي مرة أخرى");$("sv").disabled=false}};
 $("nx").onclick=()=>{const i=L.findIndex((c,i)=>!S.sc[i]||!(S.nt[i]||"").trim());if(i>=0){err(`أكملي الدرجة والملاحظات في البند: ${L[i][0]}`);const d=document.querySelectorAll("details")[i];d.open=true;d.scrollIntoView({block:"center"})}else go(2)}}
function p3(){
 const L=items();let t=0,mx=0;L.forEach((c,i)=>{t+=S.sc[i]||0;mx+=c[1]});
 const back=m=>{$("view").innerHTML=`<h2>${m}</h2><div class="nav"><span></span><button class="btn p" id="again">العودة لقائمة الموظفات</button></div>`;$("again").onclick=()=>{Object.assign(S,{emp:"",eid:"",cat:-1,sc:{},nt:{},free:"",edit:false});go(0)}};
 $("view").innerHTML=`<h2>المراجعة</h2><p>الموظفة: <b>${esc(S.emp)}</b> — ${CATS[S.cat]}<br>${esc(S.cur.unit)}<br>المقيِّمة: ${esc(EV())}</p>
 <div class="total">المجموع: ${t} من ${mx} (${Math.round(t/mx*100)}٪)</div>
 <table><tr><th>البند</th><th>الدرجة</th><th>الملاحظات</th></tr>${L.map((c,i)=>`<tr><td>${c[0]}</td><td>${S.sc[i]}/${c[1]}</td><td>${esc(S.nt[i])}</td></tr>`).join("")}</table>
 ${S.free?`<p><b>مساحة حرة:</b> ${esc(S.free)}</p>`:""}
 <div class="err noprint" id="msg"></div><div class="nav noprint"><button class="btn" id="bk">رجوع</button><button class="btn" onclick="print()">طباعة</button><button class="btn p" id="sd">${S.edit?"حفظ التعديل":"إرسال التقييم"}</button></div>`;
 $("bk").onclick=()=>go(1);
 $("sd").onclick=async()=>{$("sd").disabled=true;$("msg").textContent="جارٍ الإرسال...";
  const body={ev:EV(),emp:S.emp,dom:S.cur.dom,unit:S.cur.unit,cat:CATS[S.cat],total:t,max:mx,items:JSON.stringify(L.map((c,i)=>({b:c[0],s:S.sc[i],m:c[1],n:S.nt[i]}))),free:S.free||"",at:firebase.firestore.FieldValue.serverTimestamp()};
  try{await db.doc("evaluations/"+S.k+"_"+S.eid).set(body);
   if(!S.edit)await db.doc("mgrState/"+S.k).set({emps:{[S.eid]:{s:"done",d:new Date().toLocaleDateString("en-CA"),dr:""}}},{merge:true});
   await refresh();back(S.edit?"تم تحديث التقييم.":"شكرًا لك، تم حفظ التقييم.")}
  catch(e){if(e.code=="permission-denied"){await refresh().catch(()=>{});return back(S.edit?"انتهت مدة التعديل أو أُغلق التقييم.":"تم تقييم هذه الموظفة سابقاً أو أُغلق التقييم.")}
   $("msg").textContent="تعذر الإرسال، حاولي مرة أخرى";$("sd").disabled=false}}}
draw();
</script>
</body>
</html>
