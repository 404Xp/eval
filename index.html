<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تقييم الأداء الوظيفي | تحفيظ الشرقية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{--navy:#33335f;--sky:#7bc4e0;--bg:#f4f5fa;--line:#e4e4ee;--mut:#6b6b8a;--red:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--navy);font-family:Tajawal,system-ui,sans-serif;line-height:1.7}
header{background:#fff;border-bottom:4px solid var(--sky);padding:14px 24px;display:flex;gap:16px;align-items:center}
.logo{font-weight:700;font-size:20px;line-height:1.2;color:var(--navy);border-inline-end:2px solid var(--line);padding-inline-end:16px}
header h1{margin:0;font-size:22px}header p{margin:0;color:var(--mut);font-size:15px}
main{max-width:760px;margin:32px auto;padding:0 16px}
.card{background:#fff;border-radius:24px;padding:32px;box-shadow:0 2px 14px #33335f14}
.steps{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:28px}
.st{display:flex;flex-direction:column;align-items:center;font-size:13px;color:var(--mut);gap:4px}
.st i{width:40px;height:40px;border-radius:50%;background:#e8e8ee;display:grid;place-items:center;font-style:normal;font-weight:700}
.st.on{color:var(--navy);font-weight:700}.st.on i{background:var(--navy);color:#fff}
.st.done i{background:var(--sky);color:var(--navy)}
.bar{height:3px;width:60px;background:#e8e8ee;margin-bottom:20px}.bar.done{background:var(--sky)}
h2{margin:0 0 20px;font-size:24px}
label.f{display:block;font-weight:700;margin:18px 0 6px}label.f b{color:var(--red)}
input[type=text],select,textarea{width:100%;font:inherit;padding:13px 16px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--navy)}
input:focus,select:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{font:inherit;font-weight:700;padding:22px 10px;border:2px solid var(--line);border-radius:18px;background:#fff;color:var(--navy);cursor:pointer}
.opt.sel{border-color:var(--navy);background:#e4f3fa}
.chk{display:flex;gap:10px;align-items:center;margin-top:22px;font-weight:500}.chk input{width:20px;height:20px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}
.btn{font:inherit;font-weight:700;padding:14px 30px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--navy);cursor:pointer}
.btn.p{background:var(--navy);border-color:var(--navy);color:#fff}
.err{color:var(--red);font-weight:700;margin-top:14px;min-height:24px}
details{background:var(--bg);border:2px solid var(--line);border-radius:18px;margin-bottom:12px}
summary{cursor:pointer;padding:16px 20px;font-weight:700;display:flex;justify-content:space-between;gap:10px;list-style:none}
summary::-webkit-details-marker{display:none}
summary small{font-weight:500;color:var(--mut);white-space:nowrap}
summary small.ok{color:#1d7a46;font-weight:700}
.body{padding:0 20px 20px}
.subs{list-style:none;margin:0 0 14px;padding:0}.subs li{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}.subs b{color:var(--mut);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{font:inherit;font-weight:700;min-width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:#fff;color:var(--navy);cursor:pointer}
.chip.sel{background:var(--navy);border-color:var(--navy);color:#fff}
.count{display:inline-block;background:var(--bg);border-radius:20px;padding:4px 16px;color:var(--mut);margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.total{background:#e4f3fa;border-radius:16px;padding:16px 20px;font-weight:700;font-size:20px;margin:16px 0}
.row{display:flex;align-items:center;gap:12px;background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:14px 18px;margin-bottom:10px}.row>div{flex:1}.tag{font-weight:700;font-size:14px;padding:4px 12px;border-radius:20px;background:#e8e8ee}.tag.done{background:#d9f2e3;color:#1d7a46}.tag.draft{background:#fff1cc;color:#8a5a00}.btn.sm{padding:8px 18px}.nav{flex-wrap:wrap}
@media(max-width:560px){.row{flex-wrap:wrap}.card{padding:20px}.opts{grid-template-columns:1fr}.bar{width:24px}}
@media print{header,.steps,.nav,.noprint{display:none}body{background:#fff}.card{box-shadow:none}}
</style>
</head>

const CR=[[["تحقيق الأهداف العليا للجمعية",4,[["التفهم للأهداف العليا للجمعية و رسالتها",1],["الحرص على تحقيق أهداف الجمعية في ذاتها قولا و عملا و سمتا",2],["الحرص على تحقيق أهداف الجمعية في أعمالها و إنجازاتها",1]]],["الاهتمام بالنمو القرآني والمعرفي",7,[["الحرص على تطوير مستواها الذاتي في القرآن الكريم",3],["حضور البرامج التدريبية و اللقاءات التي تعقد في بيئة العمل",3],["تطبق نموها المعرفي و خبراتها الجديدة في مجال عملها",1]]],["التمكن من المادة العلمية والقدرة على تحقيقها",7,[["مستوى المعلمة و مدى تمكنها من المادة العلمية",4],["مدى الإلمام الجيد بما ترتبط به المادة العلمية من علوم و مراجع أساسية كالتجويد",2],["مدى تفهم الأهداف والقدرة على تحقيقها",1]]],["الإلمام بالأسس التربوية في تطبيق الدروس",7,[["التفهم لسير الحلقة المعتمد و طرق المتابعة وتأكيد المعلومة وأساليب التعامل",2],["القدرة على تقديم الحلقة وفق سير الحلقة المعتمد",2],["صحة مراحل الدرس واستيفائها ومناسبتها للزمن وتحقيق الهدف منها",3]]],["الاهتمام بالتقويم المستمر ومراعاة الفروق الفردية",6,[["الحرص على استخدام مستند المتابعة و استكماله بشكل دائم",4],["مراعاة الفروق الفردية للدارسات في تقويم أدائهن",1],["القدرة على تقويم الدارسات بطريقة صحيحة و دقة و عدل",1]]],["المهارة في عرض الدروس وإدارة الفصل",7,[["قدرة المعلمة على تصويب التلاوة وتلقين الدارسات وشرح المعلومات و المهارة في تأكيدها",2],["حرص المعلمة على تحفيز الدارسات للعملية التعليمية وشد انتباههن",2],["مدى تمكن المعلمة من الإدارة الصفية وضبط الدارسات",2],["قدرة المعلمة على حل المشكلات و علاج المواقف",1]]],["سلامة اللغة كتابة ولفظاً",5,[["تتحدث بلغة فصحى مبسطة خلال العمل كالاجتماعات والتدريس والمناقشات في الحلقة",2],["تلتزم بكتابة صحيحة الأسلوب واضحة الصياغة",1],["خلو كتابتها من الأخطاء اللغوية أو الإملائية",1],["متابعة صحة اللغة في الأعمال الشفوية و التحريرية للدارسات",1]]],["توزيع المنهج و ملاءمة ما نفذ منه للزمن",5,[["التزام المعلمة بتقديمه مفردات المنهج كاملةً",2],["قدرة المعلمة على توزيع مفردات المنهج لجزيئات مناسبة كالمراجعة الكبرى",2],["حرص المعلمة على السير وفق الخطة بشكل يضمن إنهاء المنهج في الوقت المحدد مع إعطائه حقه",1]]],["استخدام السبورة و المصحف و الوسائل التعليمية",4,[["اهتمام المعلمة باستخدام الوسائل التعليمية في الحلقة",1],["قدرة المعلمة على استخدام الوسائل حسب متطلبات المواقف التعليمية",1],["اهتمام المعلمة بتهيئة الوسائل التعليمية وإعدادها واستخدامها و المحافظة عليها و صيانتها",1],["مدى قدرة المعلمة على تفعيل استخدام المصاحف في الحلقة",1]]],["مستوى تحصيل الطالبات العلمي",8,[["مدى تمكن الدارسات من المادة العلمية و إتقان الحفظ والتجويد",3],["مدى التقدم في مستوى الدارسات وتوجيههن للتعلم وتحفيزهن",2],["اهتمام المعلمة بوضع خطط علاجية لرفع مستوى الدارسات و علاج مواطن القصور",3]]],["الحرص على المشاركة في المشاريع أو البرامج أو المبادرات",3,[["تؤمن بأهمية و دور المشاريع والبرامج والمبادرات في تحقيق أهداف الجمعية",1],["تتابع الدارسات في التحاقهن بالمشاريع والبرامج والمبادرات سواءً المقامة خلال العام أو فترات الإجازات وأثرها على رفع مستواهن واستكمال محفوظهن",1],["تشارك في إقامة المشاريع والبرامج والمبادرات وفق المتاح",1]]],["المحافظة على أوقات الدوام",8,[["تلتزم بالحضور و الانصراف في الأوقات المحددة",3],["تستثمر وقت العمل بشكل إيجابي",1],["تحد من الأذونات و الإجازات",2],["تحرص على تطبيق الإجراءات الإدارية وقت الاستئذان أو الغياب وتعبئة رابط الحضور والانصراف اليومي",2]]],["السلوك و السمت العام (القدوة الحسنة)",5,[["تطبق مبادئ و قيم و أخلاق الدين الإسلامي في سلوكها و تعاملها",1],["تلتزم بالحدود الشرعية فيما يتعلق بالسمت و اللباس",2],["الانضباط الذاتي بما يتوافق مع السلوكيات العامة وبيئة العمل",2]]],["تقدير المسؤولية",4,[["تنجز الأعمال في الوقت المحدد بإتقان",1],["تتحمل المسؤولية دون إلحاح من رئيستها",1],["تتحمل نتائج أخطائها دون تردد أو مراوغة",1],["لا تكثر من الشكوى من كثرة الأعمال أو المهام أو الأنظمة",1]]],["تقبل التوجيهات و تنفيذها",4,[["تصغي لمقدم التوجيهات حين حديثه",1],["تتقبل التوجيهات بصدر رحب",1],["تناقش التوجيهات مع مقدمها بموضوعية",1],["تطبق و تنفذ التوجيهات",1]]],["حسن التصرف",4,[["ملمة بصلاحياتها",1],["تستخدم الصلاحيات المتاحة في حل المشكلات و المواقف",2],["تواجه نقص الإمكانات و ضغوط العمل",1]]],["العلاقة مع الرؤساء",4,[["الاحترام و التعاون و الثقة المتبادلة",2],["توازنها بين علاقات الإنسانية  $("view").innerHTML=`${LIVE?"":'<p class="count">نسخة تجريبية: لا يتم حفظ التقييم</p>'}<h2>الدخول</h2>
 <label class="f" for="mg">اسم المديرة <b>*</b></label><input type="text" id="mg" list="ml" autocomplete="off" placeholder="اكتبي اسمك واختاريه من القائمة"><datalist id="ml">${S.mgrs.map(x=>`<option value="${x.name}">`).join("")}</datalist>
 <label class="chk"><input type="checkbox" id="ack"> أدركت خصوصية الرابط وألتزم بذلك (خاص بالقياديات فقط)</label>
 <div class="err" id="err" role="alert"></div><div class="nav"><span></span><button class="btn p" id="nx">دخول</button></div>`;
 $("nx").onclick=async()=>{const n=$("mg").value.trim();if(!$("ack").checked)return $("err").textContent="يلزم الإقرار بخصوصية الرابط";if(!S.mgrs.some(x=>x.name==n))return $("err").textContent="اختاري اسمك من القائمة";
  $("nx").disabled=true;$("err").textContent="جارٍ التحميل...";try{S.m=n;S.st=await api({a:"state",m:n});S.step=0;draw()}catch(e){$("err").textContent="تعذر التحميل، حاولي مرة أخرى";$("nx").disabled=false}}}
function dash(){
 const st=S.st.staff,done=st.filter(x=>x.status=="done").length,lab={done:"تم ✓",draft:"مسودة",new:"لم يبدأ"};
 $("view").innerHTML=`<h2>${S.m}</h2><p style="color:var(--mut);margin:0 0 12px">${S.st.unit}</p><span class="count">${done} من ${st.length} موظفات تم تقييمهن</span>
 ${st.length?"":'<p class="err">لا توجد موظفات مباشرات في موقعك</p>'}
 ${st.map((x,i)=>`<div class="row"><div><b>${x.name}</b><br><small>${x.cat}${x.date?" · "+x.date:""}</small></div><span class="tag ${x.status}">${lab[x.status]}</span>${x.status=="done"?"":`<button class="btn p sm" data-i="${i}">${x.status=="draft"?"أكملي":"ابدئي"}</button>`}</div>`).join("")}
 <div class="nav"><button class="btn" id="out">تغيير المديرة</button><span></span></div>`;
 document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const x=st[b.dataset.i],d=x.draft||{};S.emp=x.name;S.cat=CATS.indexOf(x.cat);S.sc=d.sc||{};S.nt=d.nt||{};S.free=d.free||"";go(1)});
 $("out").onclick=()=>{S.st=null;S.m="";draw()}}
function p2(){
 const L=items();
 $("view").innerHTML=`<h2>تقييم ${CATS[S.cat]==="معلمة"?"المعلمات":CATS[S.cat]==="إدارية"?"الإداريات":CATS[S.cat]==="حاضنة"?"الحاضنات":"الحارسات"}</h2><span class="count" id="cnt"></span>
 ${L.map((c,i)=>{const m=c[1];return `<details ${i==0?"open":""}><summary><span>${c[0]}</span><small id="b${i}">من ${m}</small></summary><div class="body"><ul class="subs">${c[2].map(x=>`<li><span>${x[0]}</span><b>${x[1]}</b></li>`).join("")}</ul>
 <div class="chips">${Array.from({length:m},(_,k)=>`<button type="button" class="chip ${S.sc[i]==k+1?"sel":""}" data-i="${i}" data-v="${k+1}">${k+1}</button>`).join("")}</div>
 <label class="f" for="n${i}">الملاحظات <b>*</b></label><textarea id="n${i}" rows="2" data-n="${i}">${S.nt[i]||""}</textarea></div></details>`}).join("")}
 <label class="f" for="free">مساحة حرة وتفاصيل</label><textarea id="free" rows="3">${S.free}</textarea>
 <div class="err" id="err" role="alert"></div><div class="nav"><button class="btn" id="bk">رجوع</button><button class="btn" id="sv">حفظ وأكمل لاحقاً</button><button class="btn p" id="nx">مراجعة التقييم</button></div>`;
 const upd=()=>{let d=0;L.forEach((c,i)=>{const ok=S.sc[i]&&(S.nt[i]||"").trim();if(ok)d++;const b=$("b"+i);b.className=ok?"ok":"";b.textContent=S.sc[i]?`${S.sc[i]} من ${c[1]}`:`من ${c[1]}`});$("cnt").textContent=`${d} من ${L.length} بنود مكتملة`};upd();
 document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const i=b.dataset.i;S.sc[i]=+b.dataset.v;b.parentNode.querySelectorAll(".chip").forEach(x=>x.classList.toggle("sel",x==b));upd()});
 document.querySelectorAll("[data-n]").forEach(t=>t.oninput=()=>{S.nt[t.dataset.n]=t.value;upd()});
 $("free").oninput=e=>S.free=e.target.value;$("bk").onclick=()=>go(0);
 $("sv").onclick=async()=>{$("sv").disabled=true;$("err").textContent="جارٍ الحفظ...";try{const r=await api(0,{a:"draft",m:S.m,emp:S.emp,data:{sc:S.sc,nt:S.nt,free:S.free}});if(!r.ok)throw 0;await refresh();go(0)}catch(e){$("err").textContent="تعذر الحفظ، حاولي مرة أخرى";$("sv").disabled=false}};
 $("nx").onclick=()=>{const i=L.findIndex((c,i)=>!S.sc[i]||!(S.nt[i]||"").trim());if(i>=0){$("err").textContent=`أكملي الدرجة والملاحظات في البند: ${L[i][0]}`;document.querySelectorAll("details")[i].open=true;document.querySelectorAll("details")[i].scrollIntoView({block:"center"})}else go(2)}}
function p3(){
 const L=items();let t=0,mx=0;L.forEach((c,i)=>{t+=S.sc[i]||0;mx+=c[1]});
 const back=m=>{$("view").innerHTML=`<h2>${m}</h2><div class="nav"><span></span><button class="btn p" id="again">العودة لقائمة الموظفات</button></div>`;$("again").onclick=()=>{Object.assign(S,{emp:"",cat:-1,sc:{},nt:{},free:""});go(0)}};
 $("view").innerHTML=`<h2>المراجعة</h2><p>الموظفة: <b>${S.emp}</b> — ${CATS[S.cat]}<br>${S.st.unit}<br>المقيِّمة: ${S.m}</p>
 <div class="total">المجموع: ${t} من ${mx} (${Math.round(t/mx*100)}٪)</div>
 <table><tr><th>البند</th><th>الدرجة</th><th>الملاحظات</th></tr>${L.map((c,i)=>`<tr><td>${c[0]}</td><td>${S.sc[i]}/${c[1]}</td><td>${(S.nt[i]||"").replace(/</g,"&lt;")}</td></tr>`).join("")}</table>
 ${S.free?`<p><b>مساحة حرة:</b> ${S.free.replace(/</g,"&lt;")}</p>`:""}
 <div class="err noprint" id="msg"></div><div class="nav noprint"><button class="btn" id="bk">رجوع</button><button class="btn" onclick="print()">طباعة</button><button class="btn p" id="sd">إرسال التقييم</button></div>`;
 $("bk").onclick=()=>go(1);
 $("sd").onclick=async()=>{$("sd").disabled=true;$("msg").textContent="جارٍ الإرسال...";
  try{const r=await api(0,{a:"submit",m:S.m,emp:S.emp,total:t,max:mx,items:JSON.stringify(L.map((c,i)=>({b:c[0],s:S.sc[i],m:c[1],n:S.nt[i]}))),free:S.free});
  if(r.error=="already"){await refresh();return back("تم تقييم هذه الموظفة سابقاً.")}
  if(!r.ok)throw 0;await refresh();back("شكرًا لك، تم حفظ التقييم.")}catch(e){$("msg").textContent="تعذر الإرسال، حاولي مرة أخرى";$("sd").disabled=false}}}
draw();
</script>
</body>
</html>
