<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تقييم الأداء الوظيفي | إدارة الإشراف النسائي بالدمام</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{--navy:#3b4666;--sky:#e2bdb6;--bg:#f9f1f0;--line:#e8dedb;--mut:#6e6b7a;--red:#b83a32}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--navy);font-family:Tajawal,system-ui,sans-serif;line-height:1.7}
header{background:#fff;border-bottom:4px solid var(--sky);padding:14px 24px;display:flex;gap:16px;align-items:center}
.logo{display:block;height:54px;width:auto;flex:none}header .tt{border-inline-start:2px solid var(--line);padding-inline-start:16px}
header h1{margin:0;font-size:22px}header p{margin:0;color:var(--mut);font-size:15px}
main{max-width:760px;margin:32px auto;padding:0 16px}
.card{background:#fff;border-radius:24px;padding:32px;box-shadow:0 2px 14px #3b466614}
.steps{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:28px}
.st{display:flex;flex-direction:column;align-items:center;font-size:13px;color:var(--mut);gap:4px}
.st i{width:40px;height:40px;border-radius:50%;background:#ececec;display:grid;place-items:center;font-style:normal;font-weight:700}
.st.on{color:var(--navy);font-weight:700}.st.on i{background:var(--navy);color:#fff}
.st.done i{background:var(--sky);color:var(--navy)}
.bar{height:3px;width:60px;background:#ececec;margin-bottom:20px}.bar.done{background:var(--sky)}
h2{margin:0 0 20px;font-size:24px}
.wl{margin-bottom:6px}.wl small{display:block;color:var(--mut);font-size:15px;font-weight:500;line-height:1.4}.wl h2{margin:0 0 4px;font-size:28px;line-height:1.35}
label.f{display:block;font-weight:700;margin:18px 0 6px}label.f b{color:var(--red)}
input[type=text],select,textarea{width:100%;font:inherit;padding:13px 16px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--navy)}
input:focus,select:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{font:inherit;font-weight:700;padding:22px 10px;border:2px solid var(--line);border-radius:18px;background:#fff;color:var(--navy);cursor:pointer}
.opt.sel{border-color:var(--navy);background:#f6e4e0}
.chk{display:flex;gap:10px;align-items:center;margin-top:22px;font-weight:500}.chk input{width:20px;height:20px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}
.btn{font:inherit;font-weight:700;padding:14px 30px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--navy);cursor:pointer}
.btn.p{background:var(--navy);border-color:var(--navy);color:#fff}
.err{color:var(--red);font-weight:700;margin-top:14px;min-height:24px}
details{background:var(--bg);border:2px solid var(--line);border-radius:18px;margin-bottom:12px}
summary{cursor:pointer;padding:16px 20px;font-weight:700;display:flex;justify-content:space-between;gap:10px;list-style:none}
summary::-webkit-details-marker{display:none}
summary small{font-weight:500;color:var(--mut);white-space:nowrap}
summary small.ok{color:#1d7a46;font-weight:700}
.body{padding:0 20px 20px}
.subs{list-style:none;margin:0 0 14px;padding:0}.subs li{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}.subs b{color:var(--mut);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{font:inherit;font-weight:700;min-width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:#fff;color:var(--navy);cursor:pointer}
.chip.sel{background:var(--navy);border-color:var(--navy);color:#fff}
.count{display:inline-block;background:var(--bg);border-radius:20px;padding:4px 16px;color:var(--mut);margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.total{background:#f6e4e0;border-radius:16px;padding:16px 20px;font-weight:700;font-size:20px;margin:16px 0}
.row{display:flex;align-items:center;gap:12px;background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:14px 18px;margin-bottom:10px}.row>div{flex:1}.tag{font-weight:700;font-size:14px;padding:4px 12px;border-radius:20px;background:#ececec}.tag.done{background:#d9f2e3;color:#1d7a46}.tag.draft{background:#fff1cc;color:#8a5a00}.btn.sm{padding:8px 18px}.nav{flex-wrap:wrap}
.mut{color:var(--mut);margin:0 0 12px}h3{margin:0 0 6px;font-size:18px}.card2{border:2px solid var(--line);border-radius:18px;padding:16px 20px;margin:16px 0}.card2 .nav{margin-top:12px;padding-top:0;border:0}
button.row{width:100%;font:inherit;text-align:start;cursor:pointer;color:var(--navy)}
.err.top{position:sticky;top:0;z-index:5;background:#fdecea;border-radius:12px;padding:10px 14px;margin:0 0 12px}.err.top:empty{display:none}
@media(max-width:600px){
html{-webkit-text-size-adjust:100%}body{font-size:15px;line-height:1.6;background:#fff}
header{padding:10px 14px;gap:10px;border-bottom-width:3px}.logo{height:38px}header .tt{padding-inline-start:10px;border-inline-start-width:1px}
header h1{font-size:16px}header p{display:none}
main{margin:0;padding:0}.card{padding:14px 14px 20px;border-radius:0;box-shadow:none;min-height:calc(100vh - 56px)}
.steps{gap:6px;margin-bottom:16px}.st{font-size:12px;gap:2px}.st i{width:28px;height:28px;font-size:13px}.bar{width:20px;margin-bottom:16px;height:2px}
h2{font-size:19px;margin:0 0 6px}.wl h2{font-size:23px;margin:0 0 2px}.wl small{font-size:14px}h3{font-size:16px}.mut{margin:0 0 10px;font-size:14px}
label.f{margin:12px 0 4px;font-size:14px}.chk{font-size:14px;align-items:flex-start;margin:12px 0}.chk input{flex:none;margin-top:3px}
input[type=text],select,textarea{font-size:16px;padding:11px 12px;border-radius:12px}textarea{min-height:64px}
.btn{padding:0 18px;min-height:46px;font-size:15px;border-radius:12px}.btn.sm{min-height:38px;padding:0 14px;font-size:14px;flex:1}
.nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;padding-top:14px}.nav span{display:none}
.nav .btn.p{order:-1;flex:1 1 100%}.nav .btn:not(.p){flex:1 1 0}
.card2{padding:12px;margin:12px 0;border-radius:16px}.card2 .nav{margin-top:12px;padding:0}.card2 .nav .btn{flex:1 1 100%}
.count{padding:2px 12px;font-size:13px;margin-bottom:10px}
.row{display:grid;grid-template-columns:1fr auto;gap:8px 10px;padding:12px;border-radius:16px;margin-bottom:8px;align-items:center}
.row>div{min-width:0}.row small{color:var(--mut);font-size:13px}.row .tag{font-size:12px;padding:2px 10px;justify-self:end}
.row .btn{grid-column:1/-1}.row .btn.sm+.btn.sm{grid-column:auto}
.row:has(.btn.sm+.btn.sm){grid-template-columns:1fr 1fr}.row:has(.btn.sm+.btn.sm)>div{grid-column:1}.row:has(.btn.sm+.btn.sm)>.tag{grid-column:2}
.row:has(.btn.sm+.btn.sm)>.btn{grid-column:auto}
button.row{grid-template-columns:1fr auto}
details{border-radius:14px;margin-bottom:8px}summary{padding:12px 14px;font-size:15px;gap:8px}summary small{font-size:13px}
.body{padding:0 14px 14px}.subs li{font-size:13.5px;padding:6px 0;gap:10px}
.chips{gap:6px;margin-bottom:8px}.chip{min-width:42px;height:42px;font-size:15px}
.opts{grid-template-columns:1fr}.opt{padding:16px 10px}
.total{font-size:17px;padding:12px 14px;margin:12px 0;border-radius:14px}
table,thead,tbody,tr,td,th{display:block}table{font-size:14px}tr:first-child:has(th){display:none}
tr{border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
td{border:0;padding:2px 0}td:first-child{font-weight:700}
td[data-l]:empty{display:none}td[data-l]::before{content:attr(data-l) ": ";color:var(--mut);font-weight:500}
.err.top{margin:0 -4px 10px}
}
@media print{header,.steps,.nav,.noprint{display:none}body{background:#fff}.card{box-shadow:none}}
</style>
</head>

function viewEval(x,d){const L=JSON.parse(d.items||"[]");$("steps").innerHTML="";
 $("view").innerHTML=`<h2>${esc(x.n)}</h2><p class="mut">${x.c} · ${esc(d.unit)}<br>المقيِّمة: ${esc(d.ev)}</p><div class="total">المجموع: ${d.total} من ${d.max} (${Math.round(d.total/d.max*100)}٪)</div>
 <table><tr><th>البند</th><th>الدرجة</th><th>الملاحظات</th></tr>${L.map(r=>`<tr><td>${esc(r.b)}</td><td data-l="الدرجة">${r.s}/${r.m}</td><td data-l="الملاحظات">${esc(r.n)}</td></tr>`).join("")}</table>${d.free?`<p><b>مساحة حرة:</b> ${esc(d.free)}</p>`:""}
 <div class="nav noprint"><button class="btn" id="bk">رجوع</button><button class="btn" onclick="print()">طباعة</button></div>`;$("bk").onclick=draw}
function p2(){
 const L=items();
 $("view").innerHTML=`<div class="err top" id="err0" role="alert"></div><h2>تقييم ${CATS[S.cat]==="معلمة"?"المعلمات":CATS[S.cat]==="إدارية"?"الإداريات":CATS[S.cat]==="حاضنة"?"الحاضنات":"الحارسات"}</h2><p class="mut">${esc(S.emp)}${S.edit?" · تعديل تقييم سابق":""}</p><span class="count" id="cnt"></span>
 ${L.map((c,i)=>{const m=c[1];return `<details ${i==0?"open":""}><summary><span>${c[0]}</span><small id="b${i}">من ${m}</small></summary><div class="body"><ul class="subs">${c[2].map(x=>`<li><span>${x[0]}</span><b>${x[1]}</b></li>`).join("")}</ul>
 <div class="chips">${Array.from({length:m},(_,k)=>`<button type="button" class="chip ${S.sc[i]==k+1?"sel":""}" data-i="${i}" data-v="${k+1}">${k+1}</button>`).join("")}</div>
 <label class="f" for="n${i}">الملاحظات <b id="rq${i}"></b></label><textarea id="n${i}" rows="2" data-n="${i}">${esc(S.nt[i])}</textarea></div></details>`}).join("")}
 <label class="f" for="free">مساحة حرة وتفاصيل</label><textarea id="free" rows="3">${esc(S.free)}</textarea>
 <div class="err" id="err" role="alert"></div><div class="nav"><button class="btn" id="bk">رجوع</button>${S.edit?"":'<button class="btn" id="sv">حفظ وأكمل لاحقاً</button>'}<button class="btn p" id="nx">مراجعة التقييم</button></div>`;
 const err=m=>{$("err").textContent=m;$("err0").textContent=m};
 const need=i=>!!S.sc[i]&&S.sc[i]*2<L[i][1];
 const upd=()=>{let d=0;L.forEach((c,i)=>{const ok=S.sc[i]&&(!need(i)||(S.nt[i]||"").trim());if(ok)d++;$("rq"+i).textContent=need(i)?"* مطلوبة لأن الدرجة أقل من النصف":"";const b=$("b"+i);b.className=ok?"ok":"";b.textContent=S.sc[i]?`${S.sc[i]} من ${c[1]}`:`من ${c[1]}`});$("cnt").textContent=`${d} من ${L.length} بنود مكتملة`};upd();
 document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const i=b.dataset.i;S.sc[i]=+b.dataset.v;b.parentNode.querySelectorAll(".chip").forEach(x=>x.classList.toggle("sel",x==b));upd()});
 document.querySelectorAll("[data-n]").forEach(t=>t.oninput=()=>{S.nt[t.dataset.n]=t.value;upd()});
 $("free").oninput=e=>S.free=e.target.value;$("bk").onclick=()=>go(0);
 if($("sv"))$("sv").onclick=async()=>{$("sv").disabled=true;err("جارٍ الحفظ...");try{await db.doc("mgrState/"+S.k).set({emps:{[S.eid]:{s:"draft",dr:JSON.stringify({sc:S.sc,nt:S.nt,free:S.free}),d:""}}},{merge:true});await refresh();go(0)}catch(e){err("تعذر الحفظ، حاولي مرة أخرى");$("sv").disabled=false}};
 $("nx").onclick=()=>{const i=L.findIndex((c,i)=>!S.sc[i]||(need(i)&&!(S.nt[i]||"").trim()));if(i>=0){err(S.sc[i]?`اكتبي الملاحظات في البند: ${L[i][0]} (الدرجة أقل من النصف)`:`اختاري الدرجة في البند: ${L[i][0]}`);const d=document.querySelectorAll("details")[i];d.open=true;d.scrollIntoView({block:"center"})}else go(2)}}
function p3(){
 const L=items();let t=0,mx=0;L.forEach((c,i)=>{t+=S.sc[i]||0;mx+=c[1]});
 const back=m=>{$("view").innerHTML=`<h2>${m}</h2><div class="nav"><span></span><button class="btn p" id="again">العودة لقائمة الموظفات</button></div>`;$("again").onclick=()=>{Object.assign(S,{emp:"",eid:"",cat:-1,sc:{},nt:{},free:"",edit:false});go(0)}};
 $("view").innerHTML=`<h2>المراجعة</h2><p>الموظفة: <b>${esc(S.emp)}</b> — ${CATS[S.cat]}<br>${esc(S.cur.unit)}<br>المقيِّمة: ${esc(EV())}</p>
 <div class="total">المجموع: ${t} من ${mx} (${Math.round(t/mx*100)}٪)</div>
 <table><tr><th>البند</th><th>الدرجة</th><th>الملاحظات</th></tr>${L.map((c,i)=>`<tr><td>${c[0]}</td><td data-l="الدرجة">${S.sc[i]}/${c[1]}</td><td data-l="الملاحظات">${esc(S.nt[i])}</td></tr>`).join("")}</table>
 ${S.free?`<p><b>مساحة حرة:</b> ${esc(S.free)}</p>`:""}
 <div class="err noprint" id="msg"></div><div class="nav noprint"><button class="btn" id="bk">رجوع</button><button class="btn" onclick="print()">طباعة</button><button class="btn p" id="sd">${S.edit?"حفظ التعديل":"إرسال التقييم"}</button></div>`;
 $("bk").onclick=()=>go(1);
 $("sd").onclick=async()=>{$("sd").disabled=true;$("msg").textContent="جارٍ الإرسال...";
  const body={ev:EV(),emp:S.emp,dom:S.cur.dom,unit:S.cur.unit,cat:CATS[S.cat],total:t,max:mx,items:JSON.stringify(L.map((c,i)=>({b:c[0],s:S.sc[i],m:c[1],n:S.nt[i]}))),free:S.free||"",at:firebase.firestore.FieldValue.serverTimestamp()};
  try{await db.doc("evaluations/"+S.k+"_"+S.eid).set(body);
   if(!S.edit)await db.doc("mgrState/"+S.k).set({emps:{[S.eid]:{s:"done",d:new Date().toLocaleDateString("en-CA"),dr:""}}},{merge:true});
   await refresh();back(S.edit?"تم تحديث التقييم.":"شكرًا لك، تم حفظ التقييم.")}
  catch(e){if(e.code=="permission-denied"){await refresh().catch(()=>{});return back(S.edit?"انتهت مدة التعديل أو أُغلق التقييم.":"تم تقييم هذه الموظفة سابقاً أو أُغلق التقييم.")}
   $("msg").textContent="تعذر الإرسال، حاولي مرة أخرى";$("sd").disabled=false}}}
draw();
</script>
</body>
</html>
