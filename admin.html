<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة الإدارة | تقييم الأداء الوظيفي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{--navy:#3b4666;--rose:#e2bdb6;--bg:#f9f1f0;--line:#e8dedb;--mut:#6e6b7a;--red:#b83a32;--ok:#1d7a46;--warn:#b7791f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:Tajawal,system-ui,sans-serif;line-height:1.7}
header{background:#fff;border-bottom:4px solid var(--rose);padding:12px 24px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
header h1{margin:0;font-size:21px}header small{color:var(--mut)}
main{max-width:1200px;margin:24px auto;padding:0 16px}
.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 2px 14px #3b466614;margin-bottom:16px}
h2{margin:0 0 14px;font-size:21px}h3{margin:18px 0 8px;font-size:17px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.btn{font:inherit;font-weight:700;padding:9px 18px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--navy);cursor:pointer}
.btn.p,.tab.on,.btn.on{background:var(--navy);border-color:var(--navy);color:#fff}.btn:disabled{opacity:.5}.btn.sm{padding:5px 12px;font-size:14px}
input[type=text],input[type=datetime-local],select{font:inherit;padding:9px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--navy)}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:10px 0}.row label{font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:12px 0}
.k{background:var(--bg);border-radius:16px;padding:14px;text-align:center;border:2px solid transparent}.k b{display:block;font-size:26px}.k span{color:var(--mut);font-size:14px}
.k.cl{cursor:pointer}.k.cl:hover,.k.on{border-color:var(--navy)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{background:var(--bg);white-space:nowrap}th.srt{cursor:pointer;user-select:none}th.srt:hover{background:#f1e3e0}
th.srt i{display:inline-block;width:14px;color:var(--mut);font-style:normal}th.srt i:before{content:"\2195"}th.asc i:before{content:"\25B2";color:var(--navy)}th.desc i:before{content:"\25BC";color:var(--navy)}
td.cl{color:var(--navy);font-weight:700;cursor:pointer;text-decoration:underline;text-decoration-color:var(--rose);text-underline-offset:4px}td.cl:hover{background:var(--bg)}
tbody tr.rw{cursor:pointer}tbody tr.rw:hover{background:#fcf8f7}
.bar{height:10px;border-radius:6px;background:#ececec;min-width:90px;overflow:hidden}.bar i{display:block;height:100%;background:var(--navy)}
.msg{min-height:24px;font-weight:700;color:var(--ok)}.err{color:var(--red)}
.mut{color:var(--mut)}a.lnk{color:var(--navy);font-weight:700;cursor:pointer;text-decoration:underline}
.bd{font-style:normal;font-weight:700;font-size:14px;padding:3px 12px;border-radius:20px;white-space:nowrap;background:#eee;color:var(--mut)}
.bd.on,.bd.done{background:#e3f3ea;color:var(--ok)}.bd.off,.bd.none{background:#f9e3e1;color:var(--red)}.bd.draft{background:#fbf0d9;color:var(--warn)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.sum div{background:#fff;border-radius:16px;padding:14px 18px;box-shadow:0 2px 14px #3b466614;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;border-inline-start:6px solid var(--line)}
.sum div.on{border-color:var(--ok)}.sum div.off{border-color:var(--red)}
.tg{display:flex;align-items:center;gap:16px;padding:16px;margin-bottom:12px;border:2px solid var(--line);border-radius:16px;cursor:pointer}
.tg:hover{border-color:var(--rose)}.tg input{position:absolute;opacity:0;width:1px;height:1px}
.tg .tx{flex:1}.tg .tx b{font-size:18px;display:block}.tg .tx small{color:var(--mut);font-size:14px}
.sl{position:relative;width:54px;height:30px;border-radius:30px;background:#c9c5cc;flex:none;transition:.2s}
.sl:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px #0003}
.tg input:checked+.sl{background:var(--ok)}.tg input:checked+.sl:after{inset-inline-start:27px}
.tg input:focus-visible+.sl{outline:3px solid var(--rose);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.chip{background:var(--bg);border:2px solid var(--rose);border-radius:20px;padding:3px 6px 3px 14px;font-size:14px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.chip button{border:0;background:var(--navy);color:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer;font:inherit;line-height:1}
.note{background:#fbf3f1;border:2px solid var(--rose);border-inline-start:6px solid var(--navy);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.ov{position:fixed;inset:0;background:#3b466680;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:9}
.ov .card{max-width:820px;width:100%;margin:0}
@media(max-width:640px){.card{padding:16px}header{padding:12px 16px}}
</style>
</head>
<body>
<header><div><h1>لوحة الإدارة</h1><small>تقييم الأداء الوظيفي</small></div><div id="who"></div></header>
<main id="view"></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyDFFXzLJSwDv_iohknLec8ZiMy6xHkGtNc",authDomain:"staff-eval-3af95.firebaseapp.com",projectId:"staff-eval-3af95",storageBucket:"staff-eval-3af95.firebasestorage.app",messagingSenderId:"511870167807",appId:"1:511870167807:web:7c13e4c0efe5fc93be7aca"});
const db=firebase.firestore(),auth=firebase.auth(),ADMINS=["ranaaqeelorg@gmail.com","quran.dm@gmail.com"];
const $=id=>document.getElementById(id);
const DEF_MSG="التعديل على التقييمات متاح حتى {date}. اضغطي «تعديل» بجانب الموظفة لتعديل تقييمها.";
const fmtD=d=>new Intl.DateTimeFormat("ar-SA-u-ca-gregory-nu-latn",{weekday:"long",day:"numeric",month:"long",year:"numeric",hour:"numeric",minute:"2-digit",hour12:true}).format(d);
const editMsg=(set,d)=>String(set.editMsg||DEF_MSG).replace(/\{date\}/g,fmtD(d));

const esc=t=>String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const nz=s=>(s||"").replace(/[ً-ٟـ\s]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي");
const pct=(a,b)=>b?Math.round(a/b*100):0;
const ar=(a,b)=>String(a).localeCompare(String(b),"ar",{numeric:true});
const ST={done:"تم",draft:"مسودة",none:"لم يبدأ"};
const D={tab:"prg",q:""},F={dom:"",cat:"",st:"",L:"",unit:"",q:""},TS={};let GB="L";
const col=async c=>(await db.collection(c).get()).docs.map(d=>Object.assign({id:d.id},d.data()));
auth.onAuthStateChanged(u=>{
 if(!u)return loginView();
 if(ADMINS.indexOf(u.email)<0){$("view").innerHTML=`<div class="card"><h2>غير مصرّح</h2><p>الحساب <b dir="ltr">${esc(u.email)}</b> لا يملك صلاحية الدخول للوحة الإدارة.</p><button class="btn p" id="so">تسجيل الخروج</button></div>`;$("so").onclick=()=>auth.signOut();return}
 $("who").innerHTML=`<small>${esc(u.email)}</small> <button class="btn" id="out">خروج</button>`;$("out").onclick=()=>auth.signOut();load()});
function loginView(){$("who").innerHTML="";$("view").innerHTML='<div class="card"><h2>تسجيل الدخول</h2><p>لوحة الإدارة خاصة بالحسابات المصرّح لها فقط.</p><button class="btn p" id="gi">تسجيل الدخول بحساب جوجل</button><p class="err" id="le"></p></div>';
 $("gi").onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{$("le").textContent="تعذر تسجيل الدخول: "+(e.code||"")})}
async function load(){$("view").innerHTML='<div class="card">جارٍ تحميل البيانات...</div>';
 try{const [s,l,h,units,st,ev]=await Promise.all([db.doc("settings/main").get(),db.doc("managers/list").get(),db.doc("managers/halaqat").get(),col("units"),col("mgrState"),col("evaluations")]);
  D.set=s.data()||{};D.units={};units.forEach(u=>D.units[u.id]=u);D.st={};st.forEach(x=>D.st[x.id]=x.emps||{});
  D.leaders=((l.data()||{}).items||[]).map(x=>({n:x.n,k:x.k,u:x.u||[]}));
  const hu=((h.data()||{}).items||[]).flatMap(x=>x.u||[]);if(hu.length)D.leaders.push({n:"مسؤولة الحلقات",k:"H",u:hu});
  D.ev=ev;D.evById={};ev.forEach(e=>D.evById[e.id]=e);
  D.R=[];D.leaders.forEach(L=>{const seen=new Set(),E=D.st[L.k]||{};L.u.forEach(id=>{const u=D.units[id];if(!u)return;(u.staff||[]).forEach(s=>{if(seen.has(s.id))return;seen.add(s.id);
   const e=E[s.id];D.R.push({lk:L.k,id:s.id,L:L.n,dom:u.dom,unit:u.unit,name:s.n,cat:s.c,st:e&&e.s=="done"?"done":e&&e.s=="draft"?"draft":"none",ev:D.evById[L.k+"_"+s.id]})})})});
  draw()}
 catch(e){$("view").innerHTML='<div class="card"><p class="err">تعذر تحميل البيانات.</p><button class="btn p" onclick="load()">إعادة المحاولة</button></div>'}}
function draw(){const T=[["ctl","الإعدادات"],["prg","التقدم"],["srch","البحث في التقييمات"],["stat","الإحصائيات"]];
 $("view").innerHTML=`<div class="tabs">${T.map(t=>`<button class="btn tab ${D.tab==t[0]?"on":""}" data-t="${t[0]}">${t[1]}</button>`).join("")}<button class="btn" id="rl">تحديث البيانات</button></div><div id="pane"></div>`;
 document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{D.tab=b.dataset.t;draw()});$("rl").onclick=load;
 ({ctl,prg,srch,stat})[D.tab]()}

/* ===== جدول عام: ترتيب لكل عمود + عرض المزيد + نقر على الخلايا ===== */
function renderTbl(host,id,cols,rows,o){o=o||{};
 const s=TS[id]||(TS[id]={k:o.sk||null,d:o.sd||1,n:100});
 const R=rows.slice(),c=cols.find(x=>x.k==s.k);
 if(c)R.sort((a,b)=>{const x=c.get(a),y=c.get(b);return(c.t=="n"?x-y:ar(x,y))*s.d||ar(cols[0].get(a),cols[0].get(b))});
 const sh=R.slice(0,s.n);host._R=R;host._C=cols;
 host.innerHTML=`<div class="tw"><table><thead><tr>${cols.map(x=>`<th class="srt ${s.k==x.k?(s.d>0?"asc":"desc"):""}" data-k="${x.k}">${x.l}<i></i></th>`).join("")}</tr></thead><tbody>${sh.map((r,i)=>`<tr class="${o.row?"rw":""}" data-i="${i}">${cols.map((x,j)=>`<td data-j="${j}" class="${x.click?"cl":""}">${x.h?x.h(r):esc(x.get(r))}</td>`).join("")}</tr>`).join("")||`<tr><td colspan="${cols.length}" class="mut">لا توجد نتائج.</td></tr>`}</tbody></table></div>
 <p class="mut">${R.length} صف ${R.length>s.n?`<button class="btn sm" id="${id}_m">عرض المزيد</button>`:""}</p>`;
 host.querySelectorAll("th").forEach(th=>th.onclick=()=>{s.d=s.k==th.dataset.k?-s.d:1;s.k=th.dataset.k;renderTbl(host,id,cols,rows,o)});
 const mb=$(id+"_m");if(mb)mb.onclick=()=>{s.n+=200;renderTbl(host,id,cols,rows,o)};
 host.querySelector("tbody").onclick=e=>{const td=e.target.closest("td"),tr=e.target.closest("tr");if(!td||!tr||td.dataset.j==null)return;
  const r=sh[tr.dataset.i],x=cols[td.dataset.j];if(x.click){x.click(r);return}if(o.row)o.row(r)}}

/* ===== الإعدادات ===== */
const loc=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16);
function ctl(msg){const s=D.set,eu=s.editUntil&&s.editUntil.toDate?s.editUntil.toDate():null,live=!!(eu&&eu>new Date());
 const O=s.open!==false,Lk=s.linkOpen!==false,bd=(on,a,b)=>`<em class="bd ${on?"on":"off"}">${on?a:b}</em>`;
 const tg=(id,on,t,sm)=>`<label class="tg"><input type="checkbox" id="${id}" ${on?"checked":""}><span class="sl"></span><span class="tx"><b>${t}</b><small>${sm}</small></span>${bd(on,"مفتوح","مغلق")}</label>`;
 $("pane").innerHTML=`<div class="sum">
  <div class="${Lk?"on":"off"}">الرابط للقيادات ${bd(Lk,"مفتوح","مغلق")}</div>
  <div class="${O?"on":"off"}">إرسال التقييمات ${bd(O,"مفتوح","مغلق")}</div>
  <div class="${live?"on":"off"}">تعديل التقييمات ${bd(live,"مفتوح","مغلق")}</div></div>
 <div class="card"><h2>التحكم</h2>
 ${tg("c_link",Lk,"فتح الرابط للقيادات","مفتوح: تدخل القيادات بالرابط وتشوف أسماء الموظفات. مغلق: الرابط لا يفتح لأي أحد.")}
 ${tg("c_open",O,"فتح التقييم","مفتوح: تقدر القيادات ترسل التقييمات وتحفظ المسودات. مغلق: يشوفون الصفحة فقط بدون إرسال.")}
 <h3>مدة التعديل بعد الإرسال</h3><p class="mut">${live?"التعديل مفتوح حتى "+eu.toLocaleString("ar-SA"):"التعديل مغلق حالياً، التقييم المرسل لا يتغير."}</p>
 <div class="row"><label for="c_eu">ينتهي التعديل في:</label><input type="datetime-local" id="c_eu" value="${eu?loc(eu):""}"><button class="btn p" id="c_sv">حفظ التاريخ</button><button class="btn" id="c_cl">إغلاق التعديل الآن</button></div>
 <div class="row"><span class="mut">اختصارات من الآن:</span><button class="btn sm" data-dy="3">٣ أيام</button><button class="btn sm" data-dy="7">أسبوع</button><button class="btn sm" data-dy="14">أسبوعين</button></div>
 <h3>رسالة التعديل للقيادات</h3><p class="mut">تظهر للقيادات في صفحتهن طالما التعديل مفتوح. اكتبي <b dir="ltr">{date}</b> مكان موعد انتهاء التعديل.</p>
 <textarea id="c_msg" rows="3" maxlength="300" style="width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:12px;color:var(--navy)">${esc(s.editMsg||DEF_MSG)}</textarea>
 <p class="mut" style="margin:8px 0 4px">كيف تظهر:</p><div class="note" id="c_pv"></div>
 <div class="row"><button class="btn p" id="c_ms">حفظ الرسالة</button><button class="btn" id="c_md">استعادة الافتراضية</button></div>
 <p class="msg" id="m">${msg||""}</p></div>`;
 const save=async(o,t)=>{try{await db.doc("settings/main").set(o,{merge:true});Object.assign(D.set,o);ctl(t)}catch(e){$("m").className="msg err";$("m").textContent="تعذر الحفظ"}};
 $("c_open").onchange=e=>save({open:e.target.checked},e.target.checked?"تم فتح التقييم":"تم إغلاق التقييم");
 $("c_link").onchange=e=>save({linkOpen:e.target.checked},e.target.checked?"تم فتح الرابط":"تم إغلاق الرابط");
 $("c_sv").onclick=()=>{const v=$("c_eu").value;if(!v)return;save({editUntil:firebase.firestore.Timestamp.fromDate(new Date(v))},"تم حفظ تاريخ التعديل")};
 document.querySelectorAll("[data-dy]").forEach(b=>b.onclick=()=>save({editUntil:firebase.firestore.Timestamp.fromDate(new Date(Date.now()+b.dataset.dy*864e5))},"تم تحديد مدة التعديل"));
 const pv=()=>{const t=$("c_msg").value||DEF_MSG;$("c_pv").innerHTML="<b>✎ التعديل متاح</b><span></span>";$("c_pv").lastChild.textContent=t.replace(/\{date\}/g,fmtD(eu||new Date(Date.now()+6048e5)))};pv();$("c_msg").oninput=pv;
 $("c_ms").onclick=()=>{const v=$("c_msg").value.trim();if(!v)return;save({editMsg:v},"تم حفظ الرسالة")};
 $("c_md").onclick=()=>{$("c_msg").value=DEF_MSG;pv()};
 $("c_cl").onclick=async()=>{try{await db.doc("settings/main").update({editUntil:firebase.firestore.FieldValue.delete()});delete D.set.editUntil;ctl("تم إغلاق التعديل")}catch(e){$("m").className="msg err";$("m").textContent="تعذر الإغلاق"}}}

/* ===== التقدم التفاعلي ===== */
const GD={L:{l:"القيادية",f:r=>r.L,fk:"L"},unit:{l:"الموقع",f:r=>r.unit,fk:"unit"},dom:{l:"المجال",f:r=>r.dom,fk:"dom"},cat:{l:"الفئة",f:r=>r.cat,fk:"cat"},staff:{l:"الموظفات"}};
const NEXT={L:"unit",unit:"staff",dom:"L",cat:"L"};
const FL={dom:"المجال",cat:"الفئة",st:"الحالة",L:"القيادية",unit:"الموقع",q:"بحث"};
function filt(){const q=nz(F.q);return D.R.filter(r=>(!F.dom||r.dom==F.dom)&&(!F.cat||r.cat==F.cat)&&(!F.L||r.L==F.L)&&(!F.unit||r.unit==F.unit)
 &&(!F.st||(F.st=="late"?r.st!="done":r.st==F.st))&&(!q||nz([r.name,r.L,r.unit,r.dom,r.cat].join(" ")).includes(q)))}
function agg(rows,key){const m=new Map();rows.forEach(r=>{const k=GD[key].f(r)||"—";let o=m.get(k);if(!o)m.set(k,o={n:k,t:0,d:0,r:0,x:0,u:new Set()});
 o.t++;o[r.st=="done"?"d":r.st=="draft"?"r":"x"]++;o.u.add(r.unit)});return[...m.values()].map(o=>(o.u=[...o.u].join("، "),o))}
const bar=r=>`<div class="bar"><i style="width:${pct(r.d,r.t)}%"></i></div>${pct(r.d,r.t)}٪`;
function go(key,val,st){const g=GD[key];F[g.fk]=val;if(st)F.st=st;GB=st?"staff":NEXT[key]||"staff";upd()}
function prg(){const opt=(a,v)=>`<option value="">الكل</option>`+[...new Set(a)].sort(ar).map(x=>`<option value="${esc(x)}" ${v==x?"selected":""}>${esc(x)}</option>`).join("");
 $("pane").innerHTML=`<div class="card"><h2>التقدم</h2>
 <div class="row"><input type="text" id="f_q" placeholder="ابحثي بأي شيء: موظفة، قيادية، موقع، مجال..." value="${esc(F.q)}" style="flex:1;min-width:240px">
  <label>المجال <select id="f_dom">${opt(D.R.map(r=>r.dom),F.dom)}</select></label>
  <label>الفئة <select id="f_cat">${opt(D.R.map(r=>r.cat),F.cat)}</select></label>
  <label>الحالة <select id="f_st"><option value="">الكل</option>${[["done","تم"],["draft","مسودة"],["none","لم يبدأ"],["late","غير مكتمل (المتأخرات)"]].map(x=>`<option value="${x[0]}" ${F.st==x[0]?"selected":""}>${x[1]}</option>`).join("")}</select></label></div>
 <div id="chips"></div><div class="row"><label>تجميع حسب:</label><span id="gb"></span><span style="flex:1"></span><button class="btn sm" id="cp">نسخ المتأخرات</button><button class="btn sm" id="orph">حالات بدون تقييم</button><button class="btn sm" id="csv">تصدير CSV</button></div>
 <div class="cards" id="kp"></div><p class="mut">اضغطي على أي اسم أو رقم في الجدول لتفصيله. الموظفة عند قياديتين تُحسب مرتين (تقييم لكل قيادية).</p><div id="tb"></div></div>`;
 $("f_q").oninput=e=>{F.q=e.target.value;upd(1)};
 ["dom","cat","st"].forEach(k=>$("f_"+k).onchange=e=>{F[k]=e.target.value;upd()});
 $("cp").onclick=()=>{const t=agg(filt(),"L").filter(o=>o.d<o.t).map(o=>o.n+" ("+o.d+"/"+o.t+")").join("\n");try{navigator.clipboard.writeText(t);$("cp").textContent="تم النسخ"}catch(e){}};
 $("orph").onclick=orphans;
 $("csv").onclick=()=>{const h=$("tb");if(!h._R)return;const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"',cs=h._C.filter(c=>!c.nocsv);
  const t=[cs.map(c=>q(c.l)).join(",")].concat(h._R.map(r=>cs.map(c=>q(c.get(r))).join(","))).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+t],{type:"text/csv;charset=utf-8"}));a.download="progress.csv";a.click()};
 upd()}
function upd(keep){const rows=filt(),T={t:rows.length,d:0,r:0,x:0};rows.forEach(r=>T[r.st=="done"?"d":r.st=="draft"?"r":"x"]++);
 if(!keep){["dom","cat","st"].forEach(k=>$("f_"+k).value=F[k])}
 $("chips").innerHTML=Object.keys(F).filter(k=>F[k]&&k!="q").map(k=>`<span class="chip">${FL[k]}: ${esc(k=="st"?(F.st=="late"?"غير مكتمل":ST[F.st]):F[k])}<button data-x="${k}" aria-label="إزالة">×</button></span>`).join("")+(Object.values(F).some(Boolean)?'<button class="btn sm" id="clr">مسح الكل</button>':"");
 document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{F[b.dataset.x]="";if(b.dataset.x=="q")$("f_q").value="";upd()});
 if($("clr"))$("clr").onclick=()=>{Object.keys(F).forEach(k=>F[k]="");$("f_q").value="";upd()};
 $("gb").innerHTML=Object.keys(GD).map(k=>`<button class="btn sm ${GB==k?"on":""}" data-g="${k}">${GD[k].l}</button>`).join(" ");
 document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{GB=b.dataset.g;upd()});
 const kp=(n,l,st)=>`<div class="k cl ${F.st==st?"on":""}" data-s="${st}"><b>${n}</b><span>${l}</span></div>`;
 $("kp").innerHTML=kp(T.t,"مطلوب تقييمه","")+kp(T.d,"تم","done")+kp(T.r,"مسودات","draft")+kp(T.x,"لم يبدأ","none")+`<div class="k"><b>${pct(T.d,T.t)}٪</b><span>نسبة الإنجاز</span></div>`;
 document.querySelectorAll("[data-s]").forEach(k=>k.onclick=()=>{F.st=k.dataset.s;upd()});
 const host=$("tb");
 if(GB=="staff"){const f=(k,key)=>r=>{F[k]=r[key];upd()};
  renderTbl(host,"s_st",[
   {k:"n",l:"الموظفة",t:"s",get:r=>r.name,click:r=>detail(r)},
   {k:"c",l:"الفئة",t:"s",get:r=>r.cat,click:f("cat","cat")},
   {k:"u",l:"الموقع",t:"s",get:r=>r.unit,click:f("unit","unit")},
   {k:"d",l:"المجال",t:"s",get:r=>r.dom,click:f("dom","dom")},
   {k:"l",l:"القيادية",t:"s",get:r=>r.L,click:f("L","L")},
   {k:"s",l:"الحالة",t:"s",get:r=>ST[r.st],h:r=>`<em class="bd ${r.st}">${ST[r.st]}</em>`,click:r=>{F.st=r.st;upd()}},
   {k:"p",l:"الدرجة",t:"n",get:r=>r.ev?pct(r.ev.total,r.ev.max):-1,h:r=>r.ev?`${r.ev.total}/${r.ev.max} (${pct(r.ev.total,r.ev.max)}٪)`:"—"},
   {k:"a",l:"إجراء",t:"s",nocsv:1,get:r=>r.st=="done"?"إعادة تعيين":"",h:r=>r.st=="done"?"إعادة تعيين":"",click:r=>{if(r.st=="done")resetDlg(r)}}
  ],rows,{sk:"n"});
 }else{const g=GD[GB],cols=[{k:"n",l:g.l,t:"s",get:r=>r.n,click:r=>go(GB,r.n)}];
  if(GB=="L")cols.push({k:"u",l:"المواقع",t:"s",get:r=>r.u});
  const cn=(k,l,st)=>({k:k,l:l,t:"n",get:r=>r[k],click:r=>go(GB,r.n,st)});
  cols.push(cn("t","المطلوب",""),cn("d","تم","done"),cn("r","مسودة","draft"),cn("x","لم يبدأ","none"),{k:"p",l:"الإنجاز",t:"n",get:r=>pct(r.d,r.t),h:bar});
  renderTbl(host,"g_"+GB,cols,agg(rows,GB),{sk:"p"})}}
function resetDlg(r){const o=document.createElement("div");o.className="ov";const c=()=>o.remove();
 o.innerHTML=`<div class="card"><h2>إعادة تعيين التقييم</h2><p><b>${esc(r.name)}</b><br>${esc(r.unit)} · ${esc(r.L)}</p><p class="err">سيُحذف التقييم المحفوظ (الدرجات والملاحظات) نهائياً، وتعود الموظفة "لم يبدأ" عند القيادية لتقييمها من جديد. إن كان التقييم منسوخاً للشيت فاحذفي صفه يدوياً من تبويب «التقييمات».</p><div class="row"><button class="btn p" id="rs">نعم، أعيدي التعيين</button><button class="btn" id="cx">إلغاء</button><span class="msg" id="rm"></span></div></div>`;
 document.body.appendChild(o);o.onclick=e=>{if(e.target==o)c()};o.querySelector("#cx").onclick=c;
 o.querySelector("#rs").onclick=async()=>{const b=o.querySelector("#rs");b.disabled=true;$("rm").textContent="جارٍ التنفيذ...";
  try{await db.doc("evaluations/"+r.lk+"_"+r.id).delete();await db.doc("mgrState/"+r.lk).update({["emps."+r.id]:firebase.firestore.FieldValue.delete()});c();load()}
  catch(e){b.disabled=false;$("rm").className="msg err";$("rm").textContent="تعذر التنفيذ"}}}
function orphans(){const O=D.R.filter(r=>r.st=="done"&&!r.ev);
 const o=document.createElement("div");o.className="ov";const c=()=>o.remove();
 o.innerHTML=`<div class="card"><p><a class="lnk" id="cx">إغلاق ✕</a></p><h2>حالات "تم" بدون تقييم محفوظ</h2>${O.length?`<p class="mut">هذه الموظفات تظهر "تم" عند القيادية لكن تقييمهن غير موجود (محذوف مثلاً). إعادة التعيين تحوّلهن إلى "لم يبدأ" لتقييمهن من جديد.</p><div class="tw"><table><tr><th>الموظفة</th><th>الموقع</th><th>القيادية</th></tr>${O.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.unit)}</td><td>${esc(r.L)}</td></tr>`).join("")}</table></div><div class="row"><button class="btn p" id="rs">إعادة تعيين ${O.length} حالة</button><span class="msg" id="rm"></span></div>`:'<p>لا توجد حالات يتيمة، كل الحالات "تم" لها تقييم محفوظ.</p>'}</div>`;
 document.body.appendChild(o);o.onclick=e=>{if(e.target==o)c()};o.querySelector("#cx").onclick=c;
 const b=o.querySelector("#rs");if(b)b.onclick=async()=>{b.disabled=true;$("rm").textContent="جارٍ التنفيذ...";
  const by={};O.forEach(r=>{(by[r.lk]=by[r.lk]||{})["emps."+r.id]=firebase.firestore.FieldValue.delete()});
  try{await Promise.all(Object.keys(by).map(k=>db.doc("mgrState/"+k).update(by[k])));c();load()}catch(e){b.disabled=false;$("rm").className="msg err";$("rm").textContent="تعذر التنفيذ"}}}
function detail(r){const e=r.ev;let L=[];try{L=JSON.parse((e&&e.items)||"[]")}catch(x){}
 const o=document.createElement("div");o.className="ov";
 o.innerHTML=`<div class="card"><p><a class="lnk" id="cx">إغلاق ✕</a></p><h2>${esc(r.name)}</h2><p>${esc(r.cat)} · ${esc(r.unit)} · ${esc(r.dom)}<br>القيادية: ${esc(r.L)}<br>الحالة: <em class="bd ${r.st}">${ST[r.st]}</em></p>
 ${e?`<p><b>المجموع:</b> ${e.total} من ${e.max} (${pct(e.total,e.max)}٪)</p><div class="tw"><table><tr><th>البند</th><th>الدرجة</th><th>الملاحظات</th></tr>${L.map(x=>`<tr><td>${esc(x.b)}</td><td>${x.s}/${x.m}</td><td>${esc(x.n)}</td></tr>`).join("")}</table></div>${e.free?`<p><b>مساحة حرة:</b> ${esc(e.free)}</p>`:""}`:'<p class="mut">لا يوجد تقييم مكتمل لهذه الموظفة بعد.</p>'}</div>`;
 document.body.appendChild(o);const c=()=>o.remove();o.onclick=ev=>{if(ev.target==o)c()};o.querySelector("#cx").onclick=c}

/* ===== البحث في التقييمات المكتملة ===== */
function srch(){$("pane").innerHTML=`<div class="card"><h2>البحث في التقييمات المكتملة</h2><div class="row"><input type="text" id="q" placeholder="اكتبي جزءاً من اسم الموظفة" value="${esc(D.q)}" style="flex:1;min-width:220px"></div><div id="res"></div></div>`;
 const go=()=>{D.q=$("q").value;const k=nz(D.q);if(k.length<2){$("res").innerHTML='<p class="mut">اكتبي حرفين على الأقل.</p>';return}
  const R=D.ev.filter(e=>nz(e.emp).includes(k));
  renderTbl($("res"),"s_ev",[{k:"e",l:"الموظفة",t:"s",get:e=>e.emp,click:e=>detail({name:e.emp,cat:e.cat,unit:e.unit,dom:e.dom,L:e.ev,st:"done",ev:e})},{k:"c",l:"الفئة",t:"s",get:e=>e.cat},{k:"u",l:"الموقع",t:"s",get:e=>e.unit},{k:"v",l:"المقيِّمة",t:"s",get:e=>e.ev},{k:"p",l:"الدرجة",t:"n",get:e=>pct(e.total,e.max),h:e=>`${e.total}/${e.max} (${pct(e.total,e.max)}٪)`}],R,{sk:"e"})};
 $("q").oninput=go;if(D.q)go()}

/* ===== الإحصائيات ===== */
function stat(){const g=f=>{const m={};D.ev.forEach(e=>{const k=f(e)||"—",o=m[k]||(m[k]={n:k,c:0,t:0,x:0});o.c++;o.t+=e.total;o.x+=e.max});return Object.values(m)};
 const cols=h=>[{k:"n",l:h,t:"s",get:r=>r.n},{k:"c",l:"عدد التقييمات",t:"n",get:r=>r.c},{k:"p",l:"متوسط الدرجة",t:"n",get:r=>pct(r.t,r.x),h:r=>pct(r.t,r.x)+"٪"}];
 const all=D.ev.reduce((a,e)=>({t:a.t+e.total,x:a.x+e.max}),{t:0,x:0});
 $("pane").innerHTML=`<div class="card"><h2>الإحصائيات</h2><div class="cards"><div class="k"><b>${D.ev.length}</b><span>تقييم مكتمل</span></div><div class="k"><b>${pct(all.t,all.x)}٪</b><span>المتوسط العام</span></div></div>
 <h3>حسب المجال</h3><div id="t1"></div><h3>حسب الفئة</h3><div id="t2"></div><h3>حسب الموقع</h3><div id="t3"></div></div>`;
 renderTbl($("t1"),"st1",cols("المجال"),g(e=>e.dom),{sk:"n"});renderTbl($("t2"),"st2",cols("الفئة"),g(e=>e.cat),{sk:"n"});renderTbl($("t3"),"st3",cols("الموقع"),g(e=>e.unit),{sk:"n"})}
</script>
